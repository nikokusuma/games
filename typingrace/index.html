<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Race Typing SD - Multiplayer</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f0f2f5;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      max-width: 800px;
      width: 100%;
    }
    h1 { text-align: center; color: #333; }
    .btn {
      background-color: #4CAF50;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      margin: 5px;
    }
    .btn:hover { background-color: #45a049; }
    .input-group {
      margin: 15px 0;
      display: flex;
      gap: 10px;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }
    #word-display {
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 2px;
      margin: 20px 0;
      padding: 15px;
      background: #e9ecef;
      border-radius: 6px;
      text-align: center;
    }
    .status-box {
      margin-top: 15px;
      padding: 10px;
      background: #e7f3fe;
      border-left: 6px solid #2196F3;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🏎️ Balap Ketik SD (Multiplayer)</h1>
    
    <div id="setup-area">
      <div class="input-group">
        <input type="text" id="player-name" placeholder="Masukkan Nama Anda...">
      </div>
      <button class="btn" id="btn-create">Buat Room Balapan Baru</button>
      
      <div class="input-group">
        <input type="text" id="room-code-input" placeholder="Masukkan Kode Room...">
        <button class="btn" id="btn-join">Gabung Room</button>
      </div>
    </div>

    <div id="game-area" style="display: none;">
      <div class="status-box">
        <strong>Kode Room:</strong> <span id="current-room-code">-</span> | 
        <strong>Pemain:</strong> <span id="player-list-count">0</span>
      </div>

      <div id="word-display">Menunggu Permainan Dimulai...</div>

      <div class="input-group">
        <input type="text" id="typing-input" placeholder="Ketik kata di atas di sini..." disabled>
      </div>
    </div>
  </div>

  <!-- FIREBASE MODULE SCRIPT -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      signInAnonymously, 
      onAuthStateChanged 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      doc, 
      getDoc, 
      setDoc, 
      updateDoc, 
      onSnapshot, 
      collection 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // 1. Konfigurasi Firebase Anda
    const firebaseConfig = {
      apiKey: "AIzaSyDG5RbMgAJLQgRfRTgM6ODqdexDhKc46nA",
      authDomain: "racetyping-e526b.firebaseapp.com",
      databaseURL: "https://racetyping-e526b-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "racetyping-e526b",
      storageBucket: "racetyping-e526b.firebasestorage.app",
      messagingSenderId: "160664386176",
      appId: "1:160664386176:web:6ecc3372ab0980eb544465"
    };

    // 2. Inisialisasi Firebase & Services secara eksplisit
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    let currentUser = null;

    // Login Anonim Otomatis
    signInAnonymously(auth).catch((error) => {
      console.error("Gagal melakukan Login Anonim:", error);
    });

    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        console.log("Terautentikasi dengan UID:", user.uid);
      }
    });

    // Daftar Kata SD
    const SD_WORDS = [
      "kucing", "sekolah", "pelangi", "membaca", "sepeda", "bintang", "makanan", "pohon", "sahabat",
      "matahari", "pensil", "kebersihan", "lingkungan", "olahraga", "kesehatan", "keluarga", "indonesia",
      "pancasila", "bendera", "garuda", "guru", "murid", "perpustakaan", "pengetahuan", "seragam"
    ];

    // Elemen UI
    const btnCreate = document.getElementById('btn-create');
    const btnJoin = document.getElementById('btn-join');
    const inputName = document.getElementById('player-name');
    const inputRoomCode = document.getElementById('room-code-input');
    const setupArea = document.getElementById('setup-area');
    const gameArea = document.getElementById('game-area');
    const currentRoomCodeEl = document.getElementById('current-room-code');

    // Fungsi Membuat Room
    btnCreate.addEventListener('click', async () => {
      const name = inputName.value.trim();
      if (!name) return alert("Harap masukkan nama Anda terlebih dahulu!");
      if (!currentUser) return alert("Sedang menghubungkan ke server, coba lagi dalam beberapa detik.");

      const roomCode = Math.random().toString(36).substring(2, 8).toUpperCase();
      const roomRef = doc(db, "rooms", roomCode);

      try {
        await setDoc(roomRef, {
          createdAt: new Date().toISOString(),
          status: "waiting",
          players: {
            [currentUser.uid]: {
              name: name,
              progress: 0,
              isHost: true
            }
          }
        });

        enterRoom(roomCode);
      } catch (err) {
        console.error("Gagal membuat room:", err);
        alert("Gagal membuat room: " + err.message);
      }
    });

    // Fungsi Bergabung ke Room
    btnJoin.addEventListener('click', async () => {
      const name = inputName.value.trim();
      const code = inputRoomCode.value.trim().toUpperCase();
      if (!name) return alert("Harap masukkan nama Anda!");
      if (!code) return alert("Harap masukkan kode room!");
      if (!currentUser) return alert("Sedang menghubungkan ke server, coba lagi beberapa detik lagi.");

      const roomRef = doc(db, "rooms", code);
      try {
        const docSnap = await getDoc(roomRef);
        if (!docSnap.exists()) {
          return alert("Room tidak ditemukan!");
        }

        await updateDoc(roomRef, {
          [`players.${currentUser.uid}`]: {
            name: name,
            progress: 0,
            isHost: false
          }
        });

        enterRoom(code);
      } catch (err) {
        console.error("Gagal bergabung:", err);
        alert("Gagal bergabung ke room: " + err.message);
      }
    });

    function enterRoom(code) {
      setupArea.style.display = "none";
      gameArea.style.display = "block";
      currentRoomCodeEl.innerText = code;

      // Listen perubahan data room secara realtime
      onSnapshot(doc(db, "rooms", code), (snapshot) => {
        if (snapshot.exists()) {
          const data = snapshot.data();
          const playerCount = Object.keys(data.players || {}).length;
          document.getElementById('player-list-count').innerText = playerCount;
        }
      });
    }
  </script>
</body>
</html>
