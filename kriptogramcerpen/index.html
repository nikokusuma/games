    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            min-height: 100vh;
            color: #f8fafc;
            user-select: none;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .letter-card {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .letter-card.selected {
            transform: translateY(-4px) scale(1.05);
            border-color: #f59e0b;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.4);
        }

        .letter-card.highlighted {
            background-color: rgba(245, 158, 11, 0.2);
            border-color: #fbbf24;
        }

        .keyboard-key {
            transition: all 0.15s ease;
            touch-action: manipulation;
        }

        .keyboard-key:active {
            transform: scale(0.92);
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(245, 158, 11, 0.5);
            border-radius: 4px;
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 10px rgba(245, 158, 11, 0.3); }
            50% { box-shadow: 0 0 20px rgba(245, 158, 11, 0.7); }
        }

        .win-pulse {
            animation: pulse-glow 2s infinite;
        }
    </style>
</head>

    <script>
        let soundEnabled = true;

        // Web Audio API Synthesizer for Audio Feedback
        const sound = {
            ctx: null,
            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (AudioContext) this.ctx = new AudioContext();
                }
                if (this.ctx && this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            },
            playTone(freq, type, duration) {
                if (!soundEnabled) return;
                try {
                    this.init();
                    if (!this.ctx) return;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type || 'sine';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + duration);
                } catch (e) {
                    console.error("Audio error:", e);
                }
            },
            playClick() { this.playTone(600, 'sine', 0.08); },
            playCorrect() { 
                this.playTone(523.25, 'triangle', 0.1); 
                setTimeout(() => this.playTone(659.25, 'triangle', 0.15), 100);
            },
            playError() { this.playTone(180, 'sawtooth', 0.2); },
            playWin() {
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    setTimeout(() => this.playTone(freq, 'sine', 0.25), idx * 120);
                });
            }
        };

        let currentLevelIdx = 0;
        let currentCipherMap = {}; 
        let currentReverseCipher = {}; 
        let userGuesses = {}; 
        let revealedNumbers = new Set(); 
        let selectedCipherNum = null;
        let hintsLeft = 3;
        let timerSeconds = 0;
        let timerInterval = null;

        let maxUnlockedLevel = parseInt(localStorage.getItem('kriptogram_unlocked') || '1');
        let savedCurrentLevel = parseInt(localStorage.getItem('kriptogram_current_level') || '0');

        function generateCipherMap(levelIdx) {
            const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
            let numbers = Array.from({length: 26}, (_, i) => (i + 1).toString().padStart(2, '0'));

            let seed = (levelIdx + 1) * 9973;
            function pseudoRandom() {
                seed = (seed * 9301 + 49297) % 233280;
                return seed / 233280;
            }

            for (let i = numbers.length - 1; i > 0; i--) {
                const j = Math.floor(pseudoRandom() * (i + 1));
                [numbers[i], numbers[j]] = [numbers[j], numbers[i]];
            }

            const map = {};
            const revMap = {};
            alphabet.forEach((char, i) => {
                map[char] = numbers[i];
                revMap[numbers[i]] = char;
            });

            return { map, revMap };
        }

        function initVirtualKeyboard() {

                "ASDFGHJKL".split(""),
                "ZXCVBNM".split("")
            ];

            rows.forEach((rowLetters, rowIdx) => {
                const rowElem = document.getElementById(`kbRow${rowIdx + 1}`);
                rowElem.innerHTML = "";

                rowLetters.forEach(letter => {

                    keyBtn.dataset.key = letter;
                    keyBtn.innerText = letter;

                    keyBtn.addEventListener("click", () => handleVirtualKeyPress(letter));
                    rowElem.appendChild(keyBtn);
                });

                if (rowIdx === 2) {
                    const delBtn = document.createElement("button");
                    delBtn.className = "keyboard-key bg-rose-900/60 hover:bg-rose-800/80 text-rose-200 font-bold py-2.5 sm:py-3 px-3 sm:px-4 rounded-lg text-xs sm:text-sm border border-rose-700/50 shadow-md flex items-center gap-1";

                    delBtn.title = "Hapus Tebakan";
                    delBtn.addEventListener("click", () => handleVirtualKeyPress("BACKSPACE"));
                    rowElem.appendChild(delBtn);
                }
            });
        }

        function loadLevel(levelIdx) {

            const levelData = CERPEN_LEVELS[currentLevelIdx];

            const { map, revMap } = generateCipherMap(levelIdx);
            currentCipherMap = map;
            currentReverseCipher = revMap;

            revealedNumbers = new Set();
            selectedCipherNum = null;
            hintsLeft = 3;

        function renderClueWithNumbers() {
            const container = document.getElementById("clueWordsContainer");
            container.innerHTML = "";

            const levelData = CERPEN_LEVELS[currentLevelIdx];
            const clueText = levelData.clue.toUpperCase();
            const words = clueText.split(" ");

            words.forEach((word) => {
                const wordDiv = document.createElement("div");
                wordDiv.className = "flex gap-1 items-center my-0.5";

                for (let i = 0; i < word.length; i++) {
                    const char = word[i];

                    if (/[A-Z]/.test(char)) {
                        const cipherNum = currentCipherMap[char];
                        const isSelected = selectedCipherNum === cipherNum;

                        const chip = document.createElement("div");
                        chip.className = `flex flex-col items-center justify-center bg-slate-800/90 hover:bg-slate-700 border px-1.5 py-1 rounded-lg cursor-pointer transition-all select-none ${
                            isSelected ? 'border-amber-400 bg-amber-500/20 text-amber-300 ring-2 ring-amber-400/40' : 'border-slate-700/70 text-slate-200'
                        }`;

                        chip.innerHTML = `
                            <span class="font-extrabold text-xs sm:text-sm text-amber-300">${char}</span>
                            <span class="text-[9px] sm:text-[10px] font-bold text-slate-400 border-t border-slate-700/60 w-full text-center pt-0.5 mt-0.5">#${cipherNum}</span>
                        `;

                        chip.addEventListener("click", () => {
                            sound.playClick();
                            selectedCipherNum = cipherNum;
                            renderClueWithNumbers();
                            renderCryptogram();
                        });

                        wordDiv.appendChild(chip);
                    } else {
                        const symbolSpan = document.createElement("span");
                        symbolSpan.className = "text-slate-400 font-bold px-0.5";
                        symbolSpan.innerText = char;
                        wordDiv.appendChild(symbolSpan);
                    }
                }

                container.appendChild(wordDiv);
            });
        }

        function renderCryptogram() {
            const container = document.getElementById("cryptogramContainer");
            container.innerHTML = "";

            const levelData = CERPEN_LEVELS[currentLevelIdx];
            const words = levelData.phrase.split(" ");

            words.forEach((word) => {
                const wordDiv = document.createElement("div");
                wordDiv.className = "flex gap-1 sm:gap-1.5 my-1";

                for (let i = 0; i < word.length; i++) {
                    const realChar = word[i];

                    if (/[A-Z]/.test(realChar)) {
                        const cipherNum = currentCipherMap[realChar];
                        const guessedChar = userGuesses[cipherNum] || "";
                        const isRevealed = revealedNumbers.has(cipherNum);
                        const isSelected = selectedCipherNum === cipherNum;

                        const card = document.createElement("div");
                        let classList = "letter-card flex flex-col items-center justify-between w-8 h-12 sm:w-10 sm:h-16 rounded-xl border p-1 cursor-pointer select-none shadow-md ";

                        if (isSelected) {
                            classList += "selected bg-amber-500/20 border-amber-400 text-amber-300 ";
                        } else if (selectedCipherNum && cipherNum === selectedCipherNum) {
                            classList += "highlighted border-amber-500/50 bg-amber-500/10 ";
                        } else {
                            classList += "bg-slate-800/90 hover:bg-slate-700/80 border-slate-700 text-slate-200 ";
                        }

                        if (isRevealed) {
                            classList += "ring-1 ring-emerald-500/50 ";
                        }

                        card.className = classList;
                        card.dataset.cipherNum = cipherNum;

                        const guessSpan = document.createElement("span");
                        guessSpan.className = `font-black text-sm sm:text-lg ${isRevealed ? 'text-emerald-400' : 'text-amber-300'}`;
                        guessSpan.innerText = guessedChar || " ";

                        const cipherSpan = document.createElement("span");
                        cipherSpan.className = "text-[10px] sm:text-xs font-bold text-amber-400/90 border-t border-slate-700/60 w-full text-center pt-0.5 tracking-tighter";
                        cipherSpan.innerText = `#${cipherNum}`;

                        card.appendChild(guessSpan);
                        card.appendChild(cipherSpan);

                        card.addEventListener("click", () => {
                            sound.playClick();
                            selectedCipherNum = cipherNum;
                            renderClueWithNumbers();
                            renderCryptogram();
                        });

                        wordDiv.appendChild(card);
                    }
                }

                container.appendChild(wordDiv);
            });

            if (!selectedCipherNum) {
                const firstCard = container.querySelector(".letter-card");
                if (firstCard) {
                    selectedCipherNum = firstCard.dataset.cipherNum;
                }
            }
        }

        function handleVirtualKeyPress(key) {
            if (!selectedCipherNum) return;

            if (revealedNumbers.has(selectedCipherNum)) {
                sound.playError();
                return;
            }

            if (key === "BACKSPACE") {
                sound.playClick();
                delete userGuesses[selectedCipherNum];
            } else if (/[A-Z]/.test(key)) {
                sound.playClick();
                userGuesses[selectedCipherNum] = key;
                moveToNextCard();
            }

            renderClueWithNumbers();
            renderCryptogram();
            updateKeyboardKeyStates();
            checkWinCondition();
        }

        function moveToNextCard() {
            const cards = Array.from(document.querySelectorAll(".letter-card"));
            const currentIdx = cards.findIndex(c => c.dataset.cipherNum === selectedCipherNum);

            for (let i = currentIdx + 1; i < cards.length; i++) {
                const cNum = cards[i].dataset.cipherNum;
                if (!userGuesses[cNum]) {
                    selectedCipherNum = cNum;
                    return;
                }
            }

            for (let i = 0; i <= currentIdx; i++) {
                const cNum = cards[i].dataset.cipherNum;
                if (!userGuesses[cNum]) {
                    selectedCipherNum = cNum;
                    return;
                }
            }
        }

        function updateKeyboardKeyStates() {
            const usedLetters = new Set(Object.values(userGuesses));

            document.querySelectorAll(".keyboard-key[data-key]").forEach(keyBtn => {
                const letter = keyBtn.dataset.key;
                if (usedLetters.has(letter)) {
                    keyBtn.classList.add("bg-amber-500/30", "text-amber-300", "border-amber-500/50");
                } else {
                    keyBtn.classList.remove("bg-amber-500/30", "text-amber-300", "border-amber-500/50");
                }
            });
        }

        function giveHint() {
            if (hintsLeft <= 0) {
                sound.playError();
                return;
            }

            const levelData = CERPEN_LEVELS[currentLevelIdx];
            const phraseLetters = levelData.phrase.replace(/[^A-Z]/g, "").split("");
            const unrevealed = phraseLetters.filter(realChar => {
                const cipherNum = currentCipherMap[realChar];
                return !revealedNumbers.has(cipherNum);
            });

            if (unrevealed.length === 0) return;

            const targetRealChar = unrevealed[Math.floor(Math.random() * unrevealed.length)];
            const targetCipherNum = currentCipherMap[targetRealChar];

            userGuesses[targetCipherNum] = targetRealChar;
            revealedNumbers.add(targetCipherNum);

            hintsLeft--;
            document.getElementById("hintsCount").innerText = hintsLeft;
            sound.playCorrect();

            renderClueWithNumbers();
            renderCryptogram();
            updateKeyboardKeyStates();
            checkWinCondition();
        }

        function checkWinCondition() {
            const levelData = CERPEN_LEVELS[currentLevelIdx];
            const phrase = levelData.phrase;

            for (let i = 0; i < phrase.length; i++) {
                const realChar = phrase[i];
                if (/[A-Z]/.test(realChar)) {
                    const cipherNum = currentCipherMap[realChar];
                    if (userGuesses[cipherNum] !== realChar) {
                        return false; 
                    }
                }
            }

            stopTimer();
            sound.playWin();
            launchConfetti();

            if (currentLevelIdx + 2 > maxUnlockedLevel) {
                maxUnlockedLevel = Math.min(20, currentLevelIdx + 2);
                localStorage.setItem('kriptogram_unlocked', maxUnlockedLevel);
            }

            setTimeout(() => {
                document.getElementById("victoryTitle").innerText = levelData.phrase;
                document.getElementById("victoryAuthor").innerText = `Karya: ${levelData.author}`;
                document.getElementById("victoryDesc").innerText = levelData.desc;
                document.getElementById("victoryTime").innerText = formatTime(timerSeconds);
                document.getElementById("victoryLevelNum").innerText = `${levelData.id}/20`;
                
                document.getElementById("victoryModal").classList.remove("hidden");
                document.getElementById("victoryModal").classList.add("flex");
            }, 500);

            return true;
        }

        function startTimer() {
            stopTimer();
            timerSeconds = 0;
            document.getElementById("timerDisplay").innerText = "00:00";
            timerInterval = setInterval(() => {
                timerSeconds++;
                document.getElementById("timerDisplay").innerText = formatTime(timerSeconds);
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) clearInterval(timerInterval);
        }

        function resetTimer() {
            startTimer();
        }

        function formatTime(totalSeconds) {
            const mins = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
            const secs = (totalSeconds % 60).toString().padStart(2, '0');
            return `${mins}:${secs}`;
        }

        function openLevelModal() {
            sound.playClick();
            const grid = document.getElementById("levelsGrid");
            grid.innerHTML = "";

            CERPEN_LEVELS.forEach((level, idx) => {
                const isUnlocked = level.id <= maxUnlockedLevel;
                const isCurrent = idx === currentLevelIdx;

                const btn = document.createElement("button");
                btn.className = `p-4 rounded-2xl flex flex-col items-center justify-center gap-1 transition-all border ${
                    isCurrent 
                        ? 'bg-amber-500/20 border-amber-400 text-amber-300 ring-2 ring-amber-400/50' 
                        : isUnlocked 
                            ? 'bg-slate-800/80 hover:bg-slate-700 border-slate-700 text-slate-200' 
                            : 'bg-slate-900/50 border-slate-800/60 text-slate-600 cursor-not-allowed'
                }`;

                btn.innerHTML = `
                    <div class="text-xs font-bold text-slate-400 uppercase">Level ${level.id}</div>
                    <div class="font-extrabold text-sm sm:text-base text-center line-clamp-1">
                        ${isUnlocked ? level.phrase : '<i class="fa-solid fa-lock text-slate-600"></i>'}
                    </div>
                `;

                if (isUnlocked) {
                    btn.addEventListener("click", () => {
                        document.getElementById("levelModal").classList.add("hidden");
                        document.getElementById("levelModal").classList.remove("flex");
                        loadLevel(idx);
                    });
                }

                grid.appendChild(btn);
            });

            document.getElementById("levelModal").classList.remove("hidden");
            document.getElementById("levelModal").classList.add("flex");
        }

        function launchConfetti() {
            const canvas = document.getElementById("confettiCanvas");
            const ctx = canvas.getContext("2d");
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            const colors = ['#f59e0b', '#fbbf24', '#38bdf8', '#a855f7', '#ec4899', '#10b981'];

            for (let i = 0; i < 120; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 16,
                    vy: (Math.random() - 0.7) * 16,
                    size: Math.random() * 8 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    alpha: 1,
                    decay: Math.random() * 0.015 + 0.008
                });
            }

            function animateConfetti() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let alive = false;

                particles.forEach(p => {
                    if (p.alpha > 0) {
                        alive = true;
                        p.x += p.vx;
                        p.y += p.vy;
                        p.vy += 0.25; 
                        p.alpha -= p.decay;

                        ctx.globalAlpha = Math.max(0, p.alpha);
                        ctx.fillStyle = p.color;
                        ctx.fillRect(p.x, p.y, p.size, p.size);
                    }
                });

                if (alive) {
                    requestAnimationFrame(animateConfetti);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }

            animateConfetti();
        }

        document.addEventListener("keydown", (e) => {
            const key = e.key.toUpperCase();
            if (key === "BACKSPACE" || key === "DELETE") {
                handleVirtualKeyPress("BACKSPACE");
            } else if (/^[A-Z]$/.test(key)) {
                handleVirtualKeyPress(key);
            }
        });

        document.getElementById("levelSelectBtn").addEventListener("click", openLevelModal);
        document.getElementById("closeLevelModal").addEventListener("click", () => {
            document.getElementById("levelModal").classList.add("hidden");
            document.getElementById("levelModal").classList.remove("flex");
        });

        document.getElementById("hintBtn").addEventListener("click", giveHint);

        document.getElementById("resetBtn").addEventListener("click", () => {
            sound.playClick();
            userGuesses = {};

            revealedNumbers.forEach(num => {
                userGuesses[num] = currentReverseCipher[num];
            });

            renderClueWithNumbers();
            renderCryptogram();
            updateKeyboardKeyStates();
        });

        document.getElementById("soundToggleBtn").addEventListener("click", () => {
            soundEnabled = !soundEnabled;
            const icon = document.getElementById("soundIcon");
            icon.className = soundEnabled ? "fa-solid fa-volume-high" : "fa-solid fa-volume-xmark text-slate-500";
        });

        document.getElementById("nextLevelBtn").addEventListener("click", () => {
            sound.playClick();
            document.getElementById("victoryModal").classList.add("hidden");
            document.getElementById("victoryModal").classList.remove("flex");

            if (currentLevelIdx + 1 < CERPEN_LEVELS.length) {
                loadLevel(currentLevelIdx + 1);
            } else {
                loadLevel(0);
            }
        });

        window.addEventListener("load", () => {
            initVirtualKeyboard();
            // Muat level terakhir yang disimpan jika valid dan sudah terbuka
            const initialLevel = (savedCurrentLevel >= 0 && savedCurrentLevel < CERPEN_LEVELS.length && savedCurrentLevel < maxUnlockedLevel) ? savedCurrentLevel : 0;
            loadLevel(initialLevel);
        });

        window.addEventListener("resize", () => {
            const canvas = document.getElementById("confettiCanvas");
            if (canvas) {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
        });
    </script>
</body>
</html>
