<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petualangan Logika Cilik - Kelas 2 SD</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel standalone -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Fredoka', cursive, sans-serif;
            background-color: #f0fdf4;
        }
        .bounce-slow {
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @media print {
            body {
                background-color: white !important;
                color: #1e293b !important;
                font-family: 'Fredoka', Arial, sans-serif;
            }
            .no-print {
                display: none !important;
            }
            .print-only {
                display: block !important;
            }
            .page-a4 {
                width: 100% !important;
                max-width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                border: none !important;
                box-shadow: none !important;
                background: white !important;
            }
            @page {
                size: A4 portrait;
                margin: 10mm;
            }
        }
    </style>
</head>
<body class="text-slate-800 antialiased min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Sound generator helper using Web Audio API
        const playSound = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                
                const now = ctx.currentTime;
                if (type === 'click') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(450, now);
                    gain.gain.setValueAtTime(0.1, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'win') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, now); // C5
                    osc.frequency.setValueAtTime(659.25, now + 0.1); // E5
                    osc.frequency.setValueAtTime(783.99, now + 0.2); // G5
                    osc.frequency.setValueAtTime(1046.50, now + 0.3); // C6
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);
                    osc.start(now);
                    osc.stop(now + 0.5);
                } else if (type === 'error') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.setValueAtTime(180, now + 0.1);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                }
            } catch(e) {}
        };

        // Header Component
        const Header = ({ activeTab, setActiveTab, score, studentInfo, openModal }) => {
            return (
                <header class="bg-gradient-to-r from-amber-400 via-orange-400 to-pink-500 text-white p-4 shadow-lg rounded-b-3xl no-print">
                    <div class="max-w-4xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
                        <div class="flex items-center gap-3">
                            <span class="text-4xl">🚀</span>
                            <div>
                                <h1 class="text-2xl sm:text-3xl font-bold leading-tight">Petualangan Logika Cilik</h1>
                                <p class="text-xs sm:text-sm font-medium text-amber-100 flex items-center gap-2">
                                    <span>Berpikir Komputasional</span>
                                    {studentInfo.name && (
                                        <button onClick={openModal} class="bg-white/20 hover:bg-white/30 px-2.5 py-0.5 rounded-full text-white text-xs font-bold underline transition">
                                            👤 {studentInfo.name} ({studentInfo.classNo})
                                        </button>
                                    )}
                                </p>
                            </div>
                        </div>
                        <div class="flex items-center gap-2 bg-white/20 backdrop-blur-md px-4 py-2 rounded-full border border-white/30">
                            <span class="text-2xl">⭐</span>
                            <span class="font-bold text-lg">{score} Poin</span>
                        </div>
                    </div>

                    {/* Navigation Tabs */}
                    <div class="max-w-4xl mx-auto flex justify-center gap-2 mt-4 overflow-x-auto pb-1">
                        <button 
                            onClick={() => { playSound('click'); setActiveTab(1); }}
                            class={`px-3 py-2 rounded-2xl font-bold text-xs sm:text-sm transition-all flex items-center gap-1.5 whitespace-nowrap ${activeTab === 1 ? 'bg-white text-orange-600 shadow-md scale-105' : 'bg-orange-600/40 text-white hover:bg-orange-600/60'}`}>
                            <span>🧩</span> 1. Labirin Angka
                        </button>
                        <button 
                            onClick={() => { playSound('click'); setActiveTab(2); }}
                            class={`px-3 py-2 rounded-2xl font-bold text-xs sm:text-sm transition-all flex items-center gap-1.5 whitespace-nowrap ${activeTab === 2 ? 'bg-white text-orange-600 shadow-md scale-105' : 'bg-orange-600/40 text-white hover:bg-orange-600/60'}`}>
                            <span>🃏</span> 2. Urutan Kegiatan
                        </button>
                        <button 
                            onClick={() => { playSound('click'); setActiveTab(3); }}
                            class={`px-3 py-2 rounded-2xl font-bold text-xs sm:text-sm transition-all flex items-center gap-1.5 whitespace-nowrap ${activeTab === 3 ? 'bg-white text-orange-600 shadow-md scale-105' : 'bg-orange-600/40 text-white hover:bg-orange-600/60'}`}>
                            <span>🎨</span> 3. Pola Warna
                        </button>
                        <button 
                            onClick={() => { playSound('click'); setActiveTab(4); }}
                            class={`px-3 py-2 rounded-2xl font-bold text-xs sm:text-sm transition-all flex items-center gap-1.5 whitespace-nowrap ${activeTab === 4 ? 'bg-white text-orange-600 shadow-md scale-105' : 'bg-orange-600/40 text-white hover:bg-orange-600/60'}`}>
                            <span>📊</span> 4. Laporan Hasil
                        </button>
                    </div>
                </header>
            );
        };

        // --- GAME 1: LABIRIN ANGKA (3 LEVELS WITH CLEARABLE SOLVABLE PATHS ON 4x4 GRID) ---
        const GameLabirin = ({ addScore, recordLevelResult }) => {
            const levels = [
                {
                    id: 1,
                    title: "Level 1: Pola Kelipatan 2",
                    targetPattern: [2, 4, 6],
                    instruction: "Program rute avatar dari START 🚩 ke FINISH 🏆 dengan melewati angka 2 ➔ 4 ➔ 6 secara berurutan!",
                    grid: [
                        [ {val: 'START', type: 'start'}, {val: 2, type: 'num'}, {val: null, type: 'empty'}, {val: 5, type: 'num'} ],
                        [ {val: '🧱', type: 'wall'}, {val: 4, type: 'num'}, {val: 6, type: 'num'}, {val: null, type: 'empty'} ],
                        [ {val: '🧱', type: 'wall'}, {val: 3, type: 'num'}, {val: null, type: 'empty'}, {val: null, type: 'empty'} ],
                        [ {val: '🧱', type: 'wall'}, {val: '🧱', type: 'wall'}, {val: null, type: 'empty'}, {val: 'FINISH', type: 'finish'} ]
                    ],
                    startPos: [0, 0],
                    finishPos: [3, 3]
                },
                {
                    id: 2,
                    title: "Level 2: Pola Kelipatan 3",
                    targetPattern: [3, 6, 9],
                    instruction: "Program rute avatar untuk melewati angka 3 ➔ 6 ➔ 9 lalu menuju ke FINISH!",
                    grid: [
                        [ {val: 'START', type: 'start'}, {val: 3, type: 'num'}, {val: 1, type: 'num'}, {val: null, type: 'empty'} ],
                        [ {val: '🧱', type: 'wall'}, {val: 6, type: 'num'}, {val: '🧱', type: 'wall'}, {val: null, type: 'empty'} ],
                        [ {val: '🧱', type: 'wall'}, {val: 9, type: 'num'}, {val: 5, type: 'num'}, {val: null, type: 'empty'} ],
                        [ {val: '🧱', type: 'wall'}, {val: null, type: 'empty'}, {val: null, type: 'empty'}, {val: 'FINISH', type: 'finish'} ]
                    ],
                    startPos: [0, 0],
                    finishPos: [3, 3]
                },
                {
                    id: 3,
                    title: "Level 3: Pola Kelipatan 4",
                    targetPattern: [4, 8, 12],
                    instruction: "Rancang rute presisi melintasi angka 4 ➔ 8 ➔ 12 menuju ke FINISH!",
                    grid: [
                        [ {val: 'START', type: 'start'}, {val: 4, type: 'num'}, {val: null, type: 'empty'}, {val: null, type: 'empty'} ],
                        [ {val: '🧱', type: 'wall'}, {val: 8, type: 'num'}, {val: 2, type: 'num'}, {val: '🧱', type: 'wall'} ],
                        [ {val: '🧱', type: 'wall'}, {val: null, type: 'empty'}, {val: 12, type: 'num'}, {val: null, type: 'empty'} ],
                        [ {val: '🧱', type: 'wall'}, {val: '🧱', type: 'wall'}, {val: null, type: 'empty'}, {val: 'FINISH', type: 'finish'} ]
                    ],
                    startPos: [0, 0],
                    finishPos: [3, 3]
                }
            ];

            const [currentLevelIdx, setCurrentLevelIdx] = useState(0);
            const level = levels[currentLevelIdx];

            const [commands, setCommands] = useState([]);
            const [avatarPos, setAvatarPos] = useState(level.startPos);
            const [visitedSequence, setVisitedSequence] = useState([]);
            const [isRunning, setIsRunning] = useState(false);
            const [feedback, setFeedback] = useState(null);

            useEffect(() => {
                resetGame();
            }, [currentLevelIdx]);

            const resetGame = () => {
                setCommands([]);
                setAvatarPos(level.startPos);
                setVisitedSequence([]);
                setIsRunning(false);
                setFeedback(null);
            };

            const addCommand = (dir) => {
                if (isRunning || commands.length >= 12) return;
                playSound('click');
                setCommands([...commands, dir]);
            };

            const removeCommand = (index) => {
                if (isRunning) return;
                playSound('click');
                setCommands(commands.filter((_, i) => i !== index));
            };

            const runAlgorithm = async () => {
                if (commands.length === 0 || isRunning) return;
                setIsRunning(true);
                setFeedback(null);
                playSound('click');

                let curR = level.startPos[0];
                let curC = level.startPos[1];
                let collected = [];

                setAvatarPos([curR, curC]);

                for (let i = 0; i < commands.length; i++) {
                    await new Promise(res => setTimeout(res, 500));
                    const cmd = commands[i];

                    if (cmd === 'UP') curR--;
                    else if (cmd === 'DOWN') curR++;
                    else if (cmd === 'LEFT') curC--;
                    else if (cmd === 'RIGHT') curC++;

                    // Check boundaries
                    if (curR < 0 || curR >= level.grid.length || curC < 0 || curC >= level.grid[0].length) {
                        playSound('error');
                        const msg = 'Keluar dari area batas labirin';
                        setFeedback({ type: 'error', text: 'Ups! Avatar keluar dari jalur labirin!' });
                        recordLevelResult('g1', level.id, false, 0, msg);
                        setIsRunning(false);
                        return;
                    }

                    const tile = level.grid[curR][curC];
                    if (tile.type === 'wall') {
                        playSound('error');
                        const msg = 'Menabrak rintangan tembok';
                        setFeedback({ type: 'error', text: 'Awas! Avatar menabrak rintangan tembok!' });
                        recordLevelResult('g1', level.id, false, 0, msg);
                        setIsRunning(false);
                        return;
                    }

                    setAvatarPos([curR, curC]);

                    if (tile.type === 'num' && typeof tile.val === 'number' && !collected.includes(tile.val)) {
                        collected.push(tile.val);
                        setVisitedSequence([...collected]);
                    }

                    if (tile.type === 'finish') {
                        const patternCorrect = JSON.stringify(collected) === JSON.stringify(level.targetPattern);
                        if (patternCorrect) {
                            playSound('win');
                            setFeedback({ type: 'success', text: 'Hore! Urutan angka dan rute sempurna!' });
                            addScore(20);
                            recordLevelResult('g1', level.id, true, 20, null);
                        } else {
                            playSound('error');
                            const msg = `Angka yang dilewati (${collected.join('➔') || 'kosong'}) tidak sesuai pola (${level.targetPattern.join('➔')})`;
                            setFeedback({ type: 'error', text: `Rute sampai, tapi angka yang dilewati (${collected.join('➔') || 'tidak ada'}) belum sesuai pola (${level.targetPattern.join('➔')})!` });
                            recordLevelResult('g1', level.id, false, 0, msg);
                        }
                        setIsRunning(false);
                        return;
                    }
                }

                playSound('error');
                const msg = 'Langkah habis sebelum mencapai FINISH';
                setFeedback({ type: 'error', text: 'Langkah habis sebelum mencapai garis FINISH! Tambah perintah lagi.' });
                recordLevelResult('g1', level.id, false, 0, msg);
                setIsRunning(false);
            };

            return (
                <div class="bg-white p-6 rounded-3xl shadow-md border-2 border-emerald-100 max-w-3xl mx-auto">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 mb-4 border-b pb-3 border-slate-100">
                        <div>
                            <span class="bg-emerald-100 text-emerald-800 text-xs font-bold px-3 py-1 rounded-full">Level {level.id} dari {levels.length}</span>
                            <h2 class="text-xl font-bold text-slate-800 mt-1">{level.title}</h2>
                        </div>
                        <div class="flex gap-2">
                            {levels.map((lvl, idx) => (
                                <button
                                    key={lvl.id}
                                    onClick={() => setCurrentLevelIdx(idx)}
                                    class={`px-3 py-1 rounded-xl text-xs font-bold transition ${currentLevelIdx === idx ? 'bg-emerald-500 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}>
                                    L{lvl.id}
                                </button>
                            ))}
                        </div>
                    </div>

                    <p class="text-slate-600 mb-4 bg-amber-50 p-3 rounded-2xl border border-amber-200 text-sm font-medium">
                        💡 <strong>Tugas:</strong> {level.instruction} Kotak tanpa angka adalah jalan umum yang aman dilewati!
                    </p>

                    {/* Maze Grid */}
                    <div class="flex justify-center my-6">
                        <div class="grid grid-cols-4 gap-2 bg-slate-100 p-3 rounded-2xl border-4 border-slate-200 shadow-inner">
                            {level.grid.map((row, rIdx) => 
                                row.map((cell, cIdx) => {
                                    const isAvatarHere = avatarPos[0] === rIdx && avatarPos[1] === cIdx;
                                    return (
                                        <div 
                                            key={`${rIdx}-${cIdx}`}
                                            class={`w-16 h-16 sm:w-20 sm:h-20 flex flex-col items-center justify-center rounded-xl font-bold text-lg relative transition-all duration-300 ${
                                                cell.type === 'wall' ? 'bg-slate-300 text-2xl shadow-inner' :
                                                cell.type === 'start' ? 'bg-sky-100 text-sky-700 border-2 border-sky-300' :
                                                cell.type === 'finish' ? 'bg-emerald-100 text-emerald-700 border-2 border-emerald-400' :
                                                cell.type === 'empty' ? 'bg-slate-50 border border-slate-200/60' :
                                                visitedSequence.includes(cell.val) ? 'bg-amber-200 text-amber-900 border-2 border-amber-400 scale-95' :
                                                'bg-white text-slate-700 border border-slate-200 shadow-sm'
                                            }`}>
                                            {cell.type === 'start' && <span class="text-[10px] text-sky-500 font-extrabold">START</span>}
                                            {cell.type === 'finish' && <span class="text-[10px] text-emerald-600 font-extrabold">FINISH</span>}
                                            {cell.type === 'empty' && <span class="w-2 h-2 rounded-full bg-slate-300"></span>}
                                            {cell.type !== 'empty' && <span class="text-xl sm:text-2xl">{cell.val}</span>}
                                            
                                            {isAvatarHere && (
                                                <div class="absolute inset-0 flex items-center justify-center bg-yellow-300/80 rounded-xl bounce-slow border-2 border-yellow-500 text-2xl shadow-md z-10">
                                                    🤖
                                                </div>
                                            )}
                                        </div>
                                    );
                                })
                            )}
                        </div>
                    </div>

                    {/* Command Sequence Bar */}
                    <div class="mb-4">
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">
                            Program Urutan Langkah ({commands.length}/12):
                        </label>
                        <div class="min-h-[56px] p-2 bg-slate-50 rounded-2xl border-2 border-dashed border-slate-300 flex items-center gap-2 overflow-x-auto">
                            {commands.length === 0 ? (
                                <span class="text-slate-400 text-xs italic px-2">Klik tombol panah di bawah untuk menyusun kode rute...</span>
                            ) : (
                                commands.map((cmd, i) => (
                                    <button 
                                        key={i} 
                                        onClick={() => removeCommand(i)}
                                        title="Klik untuk hapus"
                                        class="px-3 py-1.5 bg-indigo-500 hover:bg-rose-500 text-white rounded-xl text-xs font-bold shadow transition flex items-center gap-1 group whitespace-nowrap">
                                        <span>
                                            {cmd === 'UP' && '⬆️ Atas'}
                                            {cmd === 'DOWN' && '⬇️ Bawah'}
                                            {cmd === 'LEFT' && '⬅️ Kiri'}
                                            {cmd === 'RIGHT' && '➡️ Kanan'}
                                        </span>
                                        <span class="text-rose-200 hidden group-hover:inline">✕</span>
                                    </button>
                                ))
                            )}
                        </div>
                    </div>

                    {/* Controls */}
                    <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
                        <div class="grid grid-cols-4 gap-2 w-full sm:w-auto">
                            <button onClick={() => addCommand('UP')} disabled={isRunning} class="p-3 bg-sky-500 hover:bg-sky-600 active:scale-95 disabled:opacity-50 text-white font-bold rounded-xl shadow">⬆️</button>
                            <button onClick={() => addCommand('DOWN')} disabled={isRunning} class="p-3 bg-sky-500 hover:bg-sky-600 active:scale-95 disabled:opacity-50 text-white font-bold rounded-xl shadow">⬇️</button>
                            <button onClick={() => addCommand('LEFT')} disabled={isRunning} class="p-3 bg-sky-500 hover:bg-sky-600 active:scale-95 disabled:opacity-50 text-white font-bold rounded-xl shadow">⬅️</button>
                            <button onClick={() => addCommand('RIGHT')} disabled={isRunning} class="p-3 bg-sky-500 hover:bg-sky-600 active:scale-95 disabled:opacity-50 text-white font-bold rounded-xl shadow">➡️</button>
                        </div>

                        <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
                            <button onClick={resetGame} disabled={isRunning} class="px-4 py-3 bg-slate-200 hover:bg-slate-300 active:scale-95 text-slate-700 font-bold rounded-xl transition text-sm">
                                🔁 Reset
                            </button>
                            <button onClick={runAlgorithm} disabled={isRunning || commands.length === 0} class="flex-1 sm:flex-none px-6 py-3 bg-emerald-500 hover:bg-emerald-600 active:scale-95 disabled:opacity-50 text-white font-bold rounded-xl shadow-lg transition text-sm flex items-center justify-center gap-2">
                                🚀 Jalankan Kode
                            </button>
                        </div>
                    </div>

                    {/* Feedback Alert */}
                    {feedback && (
                        <div class={`mt-4 p-4 rounded-2xl text-sm font-bold flex items-center gap-2 ${feedback.type === 'success' ? 'bg-emerald-100 text-emerald-800 border border-emerald-300' : 'bg-rose-100 text-rose-800 border border-rose-300'}`}>
                            <span>{feedback.type === 'success' ? '🎉' : '⚠️'}</span>
                            <span>{feedback.text}</span>
                        </div>
                    )}
                </div>
            );
        };

        // --- GAME 2: KARTU URUTAN KEGIATAN (3 LEVELS) ---
        const GameUrutan = ({ addScore, recordLevelResult }) => {
            const scenarios = [
                {
                    id: 1,
                    title: 'Level 1: Membuat Roti Lapis (Sandwich)',
                    goal: 'Susun langkah-langkah membuat roti lapis lezat dari awal hingga siap dimakan!',
                    cards: [
                        { id: 1, text: 'Ambil 2 lembar roti tawar', icon: '🍞' },
                        { id: 2, text: 'Oleskan mentega & selai', icon: '🧈' },
                        { id: 3, text: 'Berikan isian keju & sayur', icon: '🧀' },
                        { id: 4, text: 'Tangkupkan roti & roti siap!', icon: '🥪' }
                    ]
                },
                {
                    id: 2,
                    title: 'Level 2: Menyikat Gigi dengan Benar',
                    goal: 'Urutkan langkah menjaga kebersihan gigi sehari-hari!',
                    cards: [
                        { id: 1, text: 'Beri pasta gigi pada sikat', icon: '🪥' },
                        { id: 2, text: 'Sikat gigi secara menyeluruh', icon: '😁' },
                        { id: 3, text: 'Kumur-kumur air bersih', icon: '💧' },
                        { id: 4, text: 'Bersihkan & simpan sikat gigi', icon: '✨' }
                    ]
                },
                {
                    id: 3,
                    title: 'Level 3: Mencuci Tangan Bebas Kuman',
                    goal: 'Urutkan langkah cuci tangan yang tepat sebelum makan!',
                    cards: [
                        { id: 1, text: 'Basahi tangan air mengalir', icon: '🚰' },
                        { id: 2, text: 'Tuang sabun & gosok 20 detik', icon: '🧼' },
                        { id: 3, text: 'Bilas tangan sampai bersih', icon: '💦' },
                        { id: 4, text: 'Keringkan dengan kain/tisu', icon: '🧻' }
                    ]
                }
            ];

            const [selectedScenarioIdx, setSelectedScenarioIdx] = useState(0);
            const activeScenario = scenarios[selectedScenarioIdx];

            const [items, setItems] = useState([]);
            const [feedback, setFeedback] = useState(null);

            useEffect(() => {
                const shuffled = [...activeScenario.cards].sort(() => Math.random() - 0.5);
                setItems(shuffled);
                setFeedback(null);
            }, [selectedScenarioIdx]);

            const moveItem = (fromIdx, toIdx) => {
                if (toIdx < 0 || toIdx >= items.length) return;
                playSound('click');
                const updated = [...items];
                const [moved] = updated.splice(fromIdx, 1);
                updated.splice(toIdx, 0, moved);
                setItems(updated);
            };

            const checkOrder = () => {
                const isCorrect = items.every((item, idx) => item.id === idx + 1);
                if (isCorrect) {
                    playSound('win');
                    setFeedback({ type: 'success', text: 'Hebat sekali! Urutan algoritma kegiatan kamu 100% tepat!' });
                    addScore(15);
                    recordLevelResult('g2', activeScenario.id, true, 15, null);
                } else {
                    playSound('error');
                    const userSeq = items.map(i => i.id).join('➔');
                    const msg = `Urutan langkah belum logis (Susunan: ${userSeq})`;
                    setFeedback({ type: 'error', text: 'Urutan belum tepat. Pikirkan kembali urutan logis dari awal!' });
                    recordLevelResult('g2', activeScenario.id, false, 0, msg);
                }
            };

            return (
                <div class="bg-white p-6 rounded-3xl shadow-md border-2 border-purple-100 max-w-3xl mx-auto">
                    <div class="flex justify-between items-center mb-4 border-b pb-3 border-slate-100">
                        <div>
                            <span class="bg-purple-100 text-purple-800 text-xs font-bold px-3 py-1 rounded-full">Level {activeScenario.id} dari {scenarios.length}</span>

                        totalErrors += lvl.errors;

                const successfulAttempts = Math.max(0, totalAttempts - totalErrors);
                const completionPercentage = totalAttempts > 0 
                    ? Math.round((successfulAttempts / totalAttempts) * 100) 
                    : 0;

                return { totalCompleted, totalLevelsCount, totalAttempts, totalErrors, successfulAttempts, completionPercentage };

                        <div class="grid grid-cols-2 text-center text-xs text-slate-700 pt-4 border-t border-dashed border-slate-300">
                            <div>
                                <p class="mb-10 font-medium">Orang Tua / Wali Siswa</p>
                                <p class="font-bold underline">( ............................................ )</p>
                            </div>
                            <div>
                                <p class="mb-10 font-medium">Guru Kelas / Pendamping</p>
                                <p class="font-bold underline">( ............................................ )</p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // Main App Component
        const App = () => {
            const [activeTab, setActiveTab] = useState(1);
            const [score, setScore] = useState(0);
            const [studentInfo, setStudentInfo] = useState({ name: '', classNo: 'Kelas 2A' });
            const [isModalOpen, setIsModalOpen] = useState(true);

            // Stats tracker for printable report
            const [gameStats, setGameStats] = useState({
                g1: {
                    levels: {
                        1: { completed: false, attempts: 0, errors: 0, score: 0, errorLogs: [] },
                        2: { completed: false, attempts: 0, errors: 0, score: 0, errorLogs: [] },
                        3: { completed: false, attempts: 0, errors: 0, score: 0, errorLogs: [] }
                    }
                },
                g2: {
                    levels: {
                        1: { completed: false, attempts: 0, errors: 0, score: 0, errorLogs: [] },
                        2: { completed: false, attempts: 0, errors: 0, score: 0, errorLogs: [] },
                        3: { completed: false, attempts: 0, errors: 0, score: 0, errorLogs: [] }
                    }
                },
                g3: {
                    levels: {
                        1: { completed: false, attempts: 0, errors: 0, score: 0, errorLogs: [] },
                        2: { completed: false, attempts: 0, errors: 0, score: 0, errorLogs: [] },
                        3: { completed: false, attempts: 0, errors: 0, score: 0, errorLogs: [] },
                        4: { completed: false, attempts: 0, errors: 0, score: 0, errorLogs: [] },
                        5: { completed: false, attempts: 0, errors: 0, score: 0, errorLogs: [] }
                    }
                }
            });

            const addScore = (pts) => {
                setScore(prev => prev + pts);
            };

            const recordLevelResult = (gameKey, levelId, isSuccess, pts, errorMsg) => {
                setGameStats(prev => {
                    const currentLvl = prev[gameKey].levels[levelId];
                    const updatedLogs = errorMsg ? [...currentLvl.errorLogs, errorMsg] : currentLvl.errorLogs;
                    return {
                        ...prev,
                        [gameKey]: {
                            ...prev[gameKey],
                            levels: {
                                ...prev[gameKey].levels,
                                [levelId]: {
                                    completed: currentLvl.completed || isSuccess,
                                    attempts: currentLvl.attempts + 1,
                                    errors: currentLvl.errors + (isSuccess ? 0 : 1),
                                    score: Math.max(currentLvl.score, pts),
                                    errorLogs: updatedLogs
                                }
                            }
                        }
                    };
                });
            };

            const handleStartGame = (e) => {
                e.preventDefault();
                playSound('win');
                setIsModalOpen(false);
            };

            return (
                <div class="min-h-screen flex flex-col justify-between pb-8">
                    {/* Start Modal for Student Info */}
                    {isModalOpen && (
                        <div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                            <div class="bg-white rounded-3xl p-6 sm:p-8 max-w-md w-full shadow-2xl border-4 border-amber-300 transform transition-all animate-bounce-short">
                                <div class="text-center mb-6">
                                    <span class="text-5xl block mb-2">🎓</span>
                                    <h2 class="text-2xl font-bold text-slate-800">Selamat Datang!</h2>
                                    <p class="text-xs text-slate-500 font-medium">Petualangan Logika Berpikir Komputasional SD</p>
                                </div>

                                <form onSubmit={handleStartGame} class="space-y-4">
                                    <div>
                                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">
                                            Nama Lengkap Siswa:
                                        </label>
                                        <input 
                                            type="text" 
                                            required
                                            value={studentInfo.name} 
                                            onChange={(e) => setStudentInfo({ ...studentInfo, name: e.target.value })}
                                            placeholder="Tuliskan nama lengkap..."
                                            class="w-full px-4 py-3 border-2 border-slate-200 rounded-2xl font-semibold focus:border-amber-400 outline-none text-sm bg-slate-50"
                                        />
                                    </div>

                                    <div>
                                        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">
                                            Pilihan Kelas:
                                        </label>
                                        <div class="grid grid-cols-2 gap-3">
                                            <button
                                                type="button"
                                                onClick={() => setStudentInfo({ ...studentInfo, classNo: 'Kelas 2A' })}
                                                class={`py-3 rounded-2xl font-bold text-sm border-2 transition ${studentInfo.classNo === 'Kelas 2A' ? 'bg-amber-400 border-amber-500 text-slate-900 shadow-md' : 'bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100'}`}>
                                                🏫 Kelas 2A
                                            </button>
                                            <button
                                                type="button"
                                                onClick={() => setStudentInfo({ ...studentInfo, classNo: 'Kelas 2B' })}
                                                class={`py-3 rounded-2xl font-bold text-sm border-2 transition ${studentInfo.classNo === 'Kelas 2B' ? 'bg-amber-400 border-amber-500 text-slate-900 shadow-md' : 'bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100'}`}>
                                                🏫 Kelas 2B
                                            </button>
                                        </div>
                                    </div>

                                    <button 
                                        type="submit"
                                        class="w-full py-4 bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-bold rounded-2xl shadow-lg transition text-base flex items-center justify-center gap-2 mt-2">
                                        <span>🚀 Mulai Bermain & Belajar</span>
                                    </button>
                                </form>
                            </div>
                        </div>
                    )}

                    <div>
                        <Header activeTab={activeTab} setActiveTab={setActiveTab} score={score} studentInfo={studentInfo} openModal={() => setIsModalOpen(true)} />
                        <main class="max-w-4xl mx-auto p-4 mt-4">
                            {activeTab === 1 && <GameLabirin addScore={addScore} recordLevelResult={recordLevelResult} />}
                            {activeTab === 2 && <GameUrutan addScore={addScore} recordLevelResult={recordLevelResult} />}
                            {activeTab === 3 && <GamePola addScore={addScore} recordLevelResult={recordLevelResult} />}
                            {activeTab === 4 && <ReportView gameStats={gameStats} studentInfo={studentInfo} setStudentInfo={setStudentInfo} totalScore={score} />}
                        </main>
                    </div>

                    <footer class="text-center text-xs text-slate-400 mt-8 no-print">
                        Modul Berpikir Komputasional & Sekuensial - Kelas 2 SD
                    </footer>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
