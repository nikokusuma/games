cp(){const m=cm(),h=bar({m:1});if(!S.k||!m)return h+need;return h+`<div class=card><h3>Capaian pembelajaran kelas ${tk()}: ${E(m.nama)}${m.agama?" ("+S.ag+")":""}</h3>${cps(m).map((t,i)=>`<div class=bar><input style="flex:1" value="${E(t)}" onchange="cpe(${i},this.value)"><button class="btn x" onclick="cpd(${i})">Hapus</button></div>`).join("")}<div class=bar><input id=cn style="flex:1" placeholder="Capaian baru, mis. menjumlahkan bilangan sampai 100"><button class=btn onclick="cpa()">Tambah</button></div></div>`},
nilai(){const m=cm(),h=bar({sem:1,m:1});if(!S.k||!m)return h+need;const L=m.bagian?[..."RLWS"].flatMap(c=>[1,2,3,4,5].map(n=>c+n)):[...Array(20)].map((_,i)=>i+1);
 return h+(m.bagian?"<p>R = Reading, L = Listening, W = Writing, S = Speaking</p>":"")+`<div class="card sc"><table class=t><tr><th>No<th>Nama${L.map(x=>"<th>"+x).join("")}<th>ASAS<th>Rata-rata<th>Nilai akhir</tr>${siswaM(m).map((s,i)=>{const n=S.nilai[nid(s,m)]||{},hh=n.h||[];return`<tr data-s="${s.id}"><td>${i+1}<td>${E(s.nama)}${L.map((_,j)=>`<td><input class="n h" type=number min=0 max=100 value="${hh[j]??""}" oninput="rc(this)" onchange="sn(this)">`).join("")}<td><input class="n as" type=number min=0 max=100 value="${n.asas??""}" oninput="rc(this)" onchange="sn(this)"><td class=r>${f1(avg(hh))}<td class=ak>${fin(n)}</tr>`}).join("")}</table></div><p>Nilai akhir = rata-rata dari rata-rata harian dan nilai ASAS.</p>`},
desk(){const m=cm(),h=bar({sem:1,m:1});if(!S.k||!m)return h+need;const c=cps(m);if(!c.length)return h+"<p>Belum ada capaian pembelajaran untuk pelajaran ini. Tambahkan di menu Capaian.</p>";
 return h+`<div class="card sc"><table class=t><tr><th>Nama${c.map(t=>`<th>${E(t)}`).join("")}<th>Deskripsi</tr>${siswaM(m).map(s=>{const d=(S.nilai[nid(s,m)]||{}).d||{};return`<tr><td>${E(s.nama)}${c.map((_,i)=>`<td><label><input type=checkbox ${d[i]=="o"?"checked":""} onchange="dk('${s.id}',${i},'o')"> Optimal</label><br><label><input type=checkbox ${d[i]=="b"?"checked":""} onchange="dk('${s.id}',${i},'b')"> Belum</label>`).join("")}<td>${E(desc(s,m))}</tr>`}).join("")}</table></div>`},
absen(){const h=bar({sem:1});if(!S.k)return h+"<p>Pilih kelas terlebih dahulu.</p>";return h+`<div class="card sc"><table class=t><tr><th>No<th>Nama<th>Sakit<th>Ijin<th>Alpa${S.sem=="2"?"<th>Kenaikan kelas":""}</tr>${sis().map((s,i)=>{const a=S.absen[s.id+"_"+S.sem]||{};return`<tr><td>${i+1}<td>${E(s.nama)}${["s","i","a"].map(k=>`<td><input class=n type=number min=0 value="${a[k]??""}" onchange="sa('${s.id}','${k}',this.value)">`).join("")}${S.sem=="2"?`<td><select onchange="sa('${s.id}','st',this.value)">${opt([["","-"],["naik","Naik kelas"],["tinggal","Tinggal kelas"]],a.st||"")}</select>`:""}</tr>`}).join("")}</table></div>`},
ekskul(){return`<div class=card><h3>Ekstrakurikuler</h3><div class=bar><input id=en placeholder="Nama ekstrakurikuler"><button class=btn onclick="add('ekskul',{nama:$('#en').value})">Tambah ekstrakurikuler</button></div><table class=t><tr><th>Nama<th></tr>${S.ekskul.map(e=>`<tr><td>${fi('ekskul',e.id,'nama',e.nama)}<td><button class="btn x" onclick="del('ekskul','${e.id}')">Hapus</button></tr>`).join("")}</table></div>`},
nilaiek(){const h=bar({sem:1});if(!S.k)return h+"<p>Pilih kelas terlebih dahulu.</p>";if(!S.ekskul.length)return h+"<p>Belum ada ekstrakurikuler. Tambahkan di menu Ekstrakurikuler.</p>";
 return h+`<div class="card sc"><p>Centang ekstrakurikuler yang diikuti siswa, lalu pilih nilainya.</p><table class=t><tr><th>No<th>Nama${S.ekskul.map(e=>"<th>"+E(e.nama)).join("")}</tr>${sis().map((s,i)=>{const e=(S.ek[s.id+"_"+S.sem]||{}).e||{};return`<tr><td>${i+1}<td>${E(s.nama)}${S.ekskul.map(x=>{const on=x.id in e;return`<td><label><input type=checkbox ${on?"checked":""} onchange="ek('${s.id}','${x.id}',this.checked?'':null)"> Ikut</label><br><select ${on?"":"disabled"} onchange="ek('${s.id}','${x.id}',this.value)">${opt([["","Pilih nilai"],...PR.map(p=>[p,p])],e[x.id]||"")}</select>`}).join("")}</tr>`}).join("")}</table></div>`},
cetak(){const o=S.set,k=S.kelas.find(x=>x.id==S.k),h=bar({sem:1})+`<div class="bar noprint"><button class=btn onclick="print()">Cetak rapor</button><span>Atur kertas ke F4 dan matikan header/footer browser saat mencetak. Jumlah halaman menyesuaikan panjang deskripsi.</span></div>`;if(!k)return h+"<p>Pilih kelas terlebih dahulu.</p>";
 const M=ms(),cg=`<colgroup><col style="width:6%"><col style="width:28%"><col style="width:10%"><col></colgroup>`;
 return h+`<div id=print>`+sis().map(s=>{const a=S.absen[s.id+"_"+S.sem]||{},ee=(S.ek[s.id+"_"+S.sem]||{}).e||{},eks=S.ekskul.filter(x=>x.id in ee),kn=S.sem=="2"&&a.st?(a.st=="naik"?(tk()<6?"Naik ke kelas "+(tk()+1):"Lulus"):"Tinggal di kelas "+tk()):"";
 return`<div class=st data-k="${E(k.nama)}" data-n="${E(s.nama)}"><div><h3 style="text-align:center;margin:0 0 2mm">LAPORAN HASIL BELAJAR (RAPOR)</h3><div style="text-align:center;font-weight:bold;margin-bottom:5mm">${E(o.sekolah)}</div><table class=idn><tr><td width=22%>Nama Siswa<td width=40%>: ${E(s.nama)}<td width=18%>Kelas<td>: ${E(k.nama)}<tr><td>NIS / NISN<td>: ${E(s.nis)} / ${E(s.nisn)}<td>Semester<td>: ${S.sem}<tr><td><td><td>Tahun Ajaran<td>: ${E(o.tahun)}</table></div><table class="rp mh">${cg}<tr><th>No<th>Mata Pelajaran<th>Nilai<th>Capaian Kompetensi</tr></table>${M.map((m,i)=>`<table class="rp mr">${cg}<tr><td align=center>${i+1}<td>${E(m.nama)}<td align=center>${fin(S.nilai[nid(s,m)]||{})}<td>${E(desc(s,m))}</tr></table>`).join("")}<div><p style="margin:4mm 0 1mm"><b>Ekstrakurikuler</b></p><table class=rp><tr><th width=6%>No<th>Kegiatan<th width=22%>Nilai</tr>${eks.length?eks.map((x,i)=>`<tr><td align=center>${i+1}<td>${E(x.nama)}<td align=center>${E(ee[x.id])}</tr>`).join(""):`<tr><td align=center>-<td>-<td align=center>-</tr>`}</table></div><div><table class=rp style="margin-top:4mm;width:55%"><tr><th colspan=2>Ketidakhadiran</tr><tr><td width=60%>Sakit<td align=center>${a.s?a.s+" hari":"-"}</tr><tr><td>Ijin<td align=center>${a.i?a.i+" hari":"-"}</tr><tr><td>Tanpa Keterangan<td align=center>${a.a?a.a+" hari":"-"}</tr></table>${kn?`<p><b>Keputusan</b>: ${kn}</p>`:""}</div><div><table class=ttd><tr><td><br>Orang Tua / Wali<td>Semarang, ${fD(o.tgl)}<br>Wali Kelas<tr style="height:22mm"><td><td><tr><td>(......................)<td>${E(k.wali)}</table><div style="text-align:center;margin-top:6mm">Mengetahui,<br>Kepala Sekolah<div style="height:24mm"></div><b>${E(o.kepsek)}</b></div></div></div>`}).join("")+`</div>`}
};
</script></body></html>
